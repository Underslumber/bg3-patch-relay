name: Publish Patch Relay to mod.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish
        required: true
        default: main
      version_tag:
        description: Release tag in vX.Y.Z format
        required: true
        default: v1.0.48
      validate_only:
        description: Check the runner and authenticated Patch Relay session without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: patch-relay-modio
  cancel-in-progress: false

jobs:
  publish:
    environment: Mod.io
    runs-on: [self-hosted, Windows, X64, patch-relay-toolkit]
    timeout-minutes: 40

    defaults:
      run:
        shell: powershell

    env:
      BG3TOOL_PATH: C:\Program Files (x86)\Steam\steamapps\common\Baldurs Gate 3 Toolkit\Glasses.exe
      MODIO_PUBLISHER_PATH: C:\ProgramData\BG3Modio\Publish-Modio-Toolkit.ps1
      MODIO_CDP_NODE: C:\actions-runner-patchrelay\externals\node20\bin\node.exe

    steps:
      - name: Resolve release inputs
        id: release
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = if ('${{ github.event_name }}' -eq 'release') {
              '${{ github.event.release.tag_name }}'
          } else {
              '${{ inputs.ref }}'
          }
          $tag = if ('${{ github.event_name }}' -eq 'release') {
              '${{ github.event.release.tag_name }}'
          } else {
              '${{ inputs.version_tag }}'
          }
          if ($tag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<revision>\d+)$') {
              throw "Version tag '$tag' must match vX.Y.Z."
          }
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "module_version=$($Matches.major).$($Matches.minor).$($Matches.revision).0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version_prefix=$($Matches.major).$($Matches.minor).$($Matches.revision)." | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout Patch Relay
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0

      - name: Validate dedicated VM infrastructure
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in $env:BG3TOOL_PATH, $env:MODIO_PUBLISHER_PATH, $env:MODIO_CDP_NODE) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Required VM component was not found: $path"
              }
          }
          & $env:MODIO_CDP_NODE --experimental-websocket .\scripts\finalize-modio-browser.mjs check `
            --slug bg3-underslumber-patch-relay `
            --result (Join-Path $env:RUNNER_TEMP 'patch-relay-modio-check.json')
          if ($LASTEXITCODE -ne 0) { throw "Patch Relay browser session check failed: $LASTEXITCODE" }

      - name: Capture current mod.io files
        if: ${{ github.event_name == 'release' || inputs.validate_only != true }}
        id: baseline
        run: |
          $ErrorActionPreference = 'Stop'
          $ids = & $env:MODIO_CDP_NODE --experimental-websocket .\scripts\finalize-modio-browser.mjs snapshot `
            --slug bg3-underslumber-patch-relay
          if ($LASTEXITCODE -ne 0) { throw "Could not capture the mod.io baseline: $LASTEXITCODE" }
          "file_ids=$ids" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Connect checkout to BG3 Toolkit
        if: ${{ github.event_name == 'release' || inputs.validate_only != true }}
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:MODIO_CDP_NODE --experimental-websocket .\scripts\finalize-modio-browser.mjs close-admin `
            --slug bg3-underslumber-patch-relay
          if ($LASTEXITCODE -ne 0) { throw "Could not close the stale Patch Relay browser tab: $LASTEXITCODE" }
          & .\scripts\stage-toolkit-project.ps1 -Workspace $env:GITHUB_WORKSPACE

      - name: Publish through official Toolkit
        if: ${{ github.event_name == 'release' || inputs.validate_only != true }}
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'patch-relay-modio-publish.log'
          $project = 'C:\Program Files (x86)\Steam\steamapps\common\Baldurs Gate 3\Data\Projects\PatchRelay_146ee64d-4202-44ea-bd9a-87fbcc4aa36e'
          & $env:MODIO_PUBLISHER_PATH `
            -Bg3ToolPath $env:BG3TOOL_PATH `
            -ProjectName 'PatchRelay' `
            -ProjectPath $project `
            -ModuleVersion '${{ steps.release.outputs.module_version }}' `
            -TimeoutSeconds 900 `
            -DiagnosticPath $diagnostics `
            -ModioGameId 6715
          if (-not $?) { throw 'BG3 Toolkit publication failed.' }

      - name: Finalize new file on mod.io
        if: ${{ github.event_name == 'release' || inputs.validate_only != true }}
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:RUNNER_TEMP 'patch-relay-modio-result.json'
          & $env:MODIO_CDP_NODE --experimental-websocket .\scripts\finalize-modio-browser.mjs publish `
            --slug bg3-underslumber-patch-relay `
            --expected-version-prefix '${{ steps.release.outputs.version_prefix }}' `
            --baseline-file-ids '${{ steps.baseline.outputs.file_ids }}' `
            --timeout-seconds 900 `
            --result $result
          if ($LASTEXITCODE -ne 0) { throw "mod.io finalization failed: $LASTEXITCODE" }

      - name: Upload publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-relay-modio-${{ steps.release.outputs.tag }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/patch-relay-modio-check.json
            ${{ runner.temp }}/patch-relay-modio-publish.log
            ${{ runner.temp }}/patch-relay-modio-result.json
            ${{ runner.temp }}/bg3-toolkit-publish-diagnostics/**
